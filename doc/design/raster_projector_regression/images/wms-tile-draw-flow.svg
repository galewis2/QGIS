<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">WMS tiled draw and fallback flow</title>
  <desc id="desc">A flow chart showing tile selection, the debug request limit, cached or downloaded tile composition, and preview fallback tiles sharing the same per-axis destination placement.</desc>
  <style>
    text { font-family: sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .copy { font-size: 16px; }
    .small { font-size: 14px; }
    .box { stroke: #172033; stroke-width: 2.5; rx: 7; }
    .arrow { fill: none; stroke: #172033; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#172033"/></marker></defs>
  <rect width="1200" height="680" fill="#f7f9fc"/>
  <text class="title" x="60" y="58">Tiled WMS/WMTS/XYZ draw flow</text>
  <text class="copy" x="60" y="88">Every placement path receives the actual target image width and height.</text>

  <rect class="box" x="60" y="145" width="210" height="85" fill="#e8f1fb"/>
  <text class="label" x="87" y="180">View extent</text><text class="copy" x="87" y="207">output pixels</text>
  <path class="arrow" d="M270 187H335"/>
  <rect class="box" x="335" y="145" width="220" height="85" fill="#ffffff"/>
  <text class="label" x="362" y="180">Tile matrix</text><text class="copy" x="362" y="207">row/column range</text>
  <path class="arrow" d="M555 187H620"/>
  <polygon points="710,132 800,187 710,242 620,187" fill="#fff6d8" stroke="#172033" stroke-width="2.5"/>
  <text class="small" x="659" y="181">more than</text><text class="small" x="654" y="200">10,000 tiles?</text>
  <path class="arrow" d="M800 187H900"/>
  <rect class="box" x="900" y="145" width="230" height="85" fill="#e8f1fb"/>
  <text class="label" x="927" y="180">Create requests</text><text class="copy" x="927" y="207">WMS, WMTS, or XYZ</text>
  <path class="arrow" d="M710 242V300H102"/>
  <rect class="box" x="60" y="300" width="245" height="85" fill="#fce7e5"/>
  <text class="label" x="88" y="335">Return blank image</text><text class="copy" x="88" y="362">debug builds only</text>

  <path class="arrow" d="M1015 230V300H895"/>
  <rect class="box" x="690" y="300" width="205" height="85" fill="#ffffff"/>
  <text class="label" x="718" y="335">Tile cache</text><text class="copy" x="718" y="362">or download</text>
  <path class="arrow" d="M792 385V445"/>
  <rect class="box" x="610" y="445" width="365" height="100" fill="#e8f1fb"/>
  <text class="label" x="638" y="480">destinationRect(extent, tile, width, height)</text>
  <text class="copy" x="638" y="510">independent X/Y map-units-per-pixel</text>
  <text class="copy" x="638" y="532">normal tiles and buffered resampling</text>
  <path class="arrow" d="M792 545V600"/>
  <rect class="box" x="680" y="600" width="225" height="55" fill="#dff3e5"/>
  <text class="label" x="726" y="635">Compose image</text>

  <path class="arrow" d="M690 342H510V445"/>
  <rect class="box" x="285" y="445" width="225" height="100" fill="#fff6d8"/>
  <text class="label" x="312" y="480">Preview fallback</text><text class="copy" x="312" y="508">cached lower or higher</text><text class="copy" x="312" y="530">resolution tiles</text>
  <path class="arrow" d="M510 495H610"/>
</svg>
